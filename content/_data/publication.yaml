# Title & Description
title: Digitizing al-Andalus
subtitle: The Madinat al-Zahrāʾ Capital and the Digital Study of Dispersed Umayyad Architecture
cover_image: capital/covercapital.jpeg
cover_image_alt: The marble capital from Madinat al-Zahrāʾ, Meadows Museum, SMU
reading_line: Madinat al-Zahrāʾ 3D Capital Digitization and Research Collaborative
short_title: Digitizing al-Andalus

description:
  one_line: A digital catalogue and database exploring a 10th-century Umayyad marble capital.
  full: |
    This publication documents the Madinat al-Zahrāʾ 3D Capital Digitization and Research
    Collaborative — a multi-institutional project using 3D scanning, virtual reality, and
    digital storytelling to study and share a 10th-century Islamic capital from al-Andalus.

