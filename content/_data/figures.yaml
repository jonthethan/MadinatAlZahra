  - id: "fig-4"
    label: "Figure 4"
    src: figures/evans-hymns.jpg
    caption: "Walker Evans. *Alabama Tenant Farmer Family Singing Hymns / The Tengle Family, Hale County, Alabama*, 1936."
    credit: "The J. Paul Getty Museum, Los Angeles"
    alt: "A small group of people standing in front of a doorway and rough wooden wall of a building, looking at a book in one man's hands and singing. Other figures are cropped out along the edges."

  - id: "fig-5"
    label: "Figure 5"
    src: figures/evans-burroughs.jpg
    caption: "Walker Evans. *Floyd and Lucille Burroughs, Hale County, Alabama*, 1936."
    credit: "The J. Paul Getty Museum, Los Angeles"
    alt: "A man sitting in a doorway and a young woman beside him in a chair, both barefoot, on the porch of a wooden house."

  - id: "lange-house"
    src: figures/lange-house.jpg
    caption: "Dorothea Lange. *Abandoned Dust Bowl Home*, about 1935–1940."
    credit: The J. Paul Getty Museum, Los Angeles
    alt: "An abandoned-looking wooden shack darkly colored and standing straight against a light, empty expanse of sparsely vegetated dessert and cloudy sky."

  - id: "vid-1"
    poster: figures/evans-video-still.jpg
    media_id: BpGN0UUtqqU
    media_type: youtube
    label: "Video 1"
    caption: "A selection of Walker Evans photos from the across the United States of America, 1930s."
    credit: The J. Paul Getty Museum, Los Angeles
    alt: "A narrow, unmarked paved road stretching away diagonally from the bottom right. On one side a row of houses and multi-pronged telegraph or electrical poles, on the other side a gas station sign and single car and figure."

  - id: "table-1"
    src: "tables/evans-works.html"
    media_type: table

  - id: "audio-1"
    media_id: 748443409
    media_type: soundcloud
    label: "Audio 1"
    caption: "*Modern Art Notes Podcast*, episode 429, “Dorothea Lange, Soul of a Nation,” hosted by Tyler Green, https://soundcloud.com/manpodcast/ep429."

  - id: "cat-1"
    src: figures/lange-mother-a.jpg
    caption: "Dorothea Lange, *Human Erosion in California / Migrant Mother*, 1936."
    credit: The J. Paul Getty Museum, Los Angeles
    download: true
    zoom: true
    alt: "Close in shot of a mother with her hand to her cheek, two children pressed against either side but turned away, a baby just visible on her lap."

  - id: "mother-variants"
    label: "Figure 1.1"
    caption: "Alternate versions of Dorothea Lange’s *Migrant Mother*, 1936."
    credit: "Library of Congress Prints and Photographs Division"
    annotations:
      - input: radio
        items:
        - src: figures/lange-mother-b.jpg
          label: "Variant #1"
        - src: figures/lange-mother-c.jpg
          label: "Variant #2"

  - id: "mother-annotations"
    src: "figures/lange-layers/base.jpg"
    zoom: true
    label: "Figure 1.2"
    caption: "This version of the print from the Library of Congress Prints and Photographs Division is mounted on paper board and includes an original FSA label. Note too the thumb seen in the lower right corner. It is also visible in the Getty‘s print, but Lange’s negative was later retouched to remove the thumb and in later prints, it is only a ghostly shadow."
    annotations:
      - input: checkbox
        items:
          - src: "figures/lange-layers/original-label.png"
            selected: true
          - src: "figures/lange-layers/additional-label.png"
          - src: "figures/lange-layers/scratches.png"
          - src: "figures/lange-layers/thumb.png"
            selected: true

  - id: "cat-2"
    src: figures/evans-fields-family-a.jpg
    caption: "Walker Evans, *Bud Fields with His Wife Ivy, and His Daughter Ellen, Hale County, Alabama*, 1936."
    credit: The J. Paul Getty Museum, Los Angeles
    download: true
    zoom: true
    alt: "A woman seated in a bed nursing a child, a man on a chair beside them, in a room with plain wooden floor and walls, both barefoot and staring at the camera."

  - id: "cat-2-b"
    src: figures/evans-fields-family-b.jpg
    caption: "Walker Evans, *Sharecropper's Family, Hale County, Alabama / Bud Fields and His Family, Hale County, Alabama / Bud Woods and His Family*, 1936."
    credit: The J. Paul Getty Museum, Los Angeles
    alt: "Parents and four children of varying ages, seated and posing for the camera in a room with plain wooden floor and walls."

  - id: "cat-2-c"
    src: figures/evans-bud-fields.jpg
    caption: "Walker Evans, * [William Edward (Bud) Fields, A Cotton Sharecropper, Hale County, Alabama]/[Bud Woods, Tenant Farmer]*, 1936."
    credit: The J. Paul Getty Museum, Los Angeles
    alt: "Portrait of a bare-chested moustached man, with a patterned bandana draped over his shoulders, photographed from the chest up, staring straight into the camera."

  - id: "rotating-capital"
    src: figures/rotating-capital/ezgif-frame-001.jpg
    label: "Fig. 1"
    caption: 'Rotating rendering of the 3D model of the capital, generated from EinScan HX2 scan data. MP4, 2025.'
    credit: 'Model and video by Anna Shovlin, Technology Lead and 3D Imaging Specialist, UT Dallas.'
    sequences: 
      - id: "figures/rotating-capital/"
        behavior:
        - continuous
        - sequence
        regex: /ezgif-frame-\d{3}\.jpg/
        viewing_direction: "right-to-left"

  - id: "fig-scan-setup"
    src: "images/process/scan-setup.jpg"
    caption: "Testing the EinScan HX2 with JT Ringer, DIG Lab Manager, at SMU's Deason Innovation Gym. Early trials established the scanner settings needed to capture the capital's deeply carved surfaces."
    credit: "Photo by Cristina Aldrich"

  - id: "fig-scan-anna"
    src: "images/process/scan-anna.jpg"
    caption: "Anna Shovlin (UT Dallas), the project's Technology Lead and 3D Imaging Specialist, scanning the capital with the EinScan HX2. The handheld scanner projects patterns of light onto the marble and records their distortion to measure the surface — no contact with the object required."
    credit: "Photo by Cristina Aldrich"

  - id: "fig-scan-team"
    src: "images/process/scan-team.jpg"
    caption: "JT Ringer, Nida Jaffer, and Anna Shovlin scanning the capital. Capturing the full object required passes from every angle, with the software stitching each sweep into a single continuous mesh."
    credit: "Photo by Cristina Aldrich"

  - id: "fig-scan-screen"
    src: "images/process/scan-screen.jpg"
    caption: "The scan in progress: measurement points align on screen in real time as the scanner moves across the capital's surface."

  - id: "fig-mesh-wire"
    src: "images/process/mesh-wire.jpg"
    caption: "The completed polygon mesh. Rendered without color, the digital model isolates the capital's geometry, making tool marks and carving sequences newly legible."
    credit: "Model by Anna Shovlin"

  - id: "fig-scan-toolmarks"
    src: "images/process/scan-toolmarks.jpg"
    caption: "Examining tool marks on the capital. The high-resolution scan allows researchers to study the carver's technique at a level of detail difficult to achieve with the naked eye."

  - id: "fig-print-prototype-1"
    src: "images/process/print-prototype-1.jpg"
    caption: "First prototype: an early 3D print test produced at UT Dallas from the scan data."
    credit: "Photo by Cristina Aldrich"

  - id: "fig-print-prototype-2"
    src: "images/process/print-prototype-2.jpg"
    caption: "Early prototypes were printed at DIG and UT Dallas using fused deposition modeling (FDM) printers and ABS filament, working from STL files generated by the scan."
    credit: "Photo by Cristina Aldrich"

  - id: "fig-print-scale"
    src: "images/process/print-scale.jpg"
    caption: "Three 3D prints at different scales displayed alongside the original capital — from portable teaching model to full-scale tactile reproduction."
    credit: "Photo by Cristina Aldrich"

  - id: "fig-scan-video-amine"
    src: "images/process/scan-video-amine.jpg"
    caption: "Amine Faali (UT Dallas) filming the scanning sessions. Video documentation of the process appears throughout this publication."
